<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient for dark theme -->
  <defs>
    <linearGradient id="bgGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceGradientDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1F8E9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="40" height="40" rx="8" fill="url(#bgGradientDark)"/>

  <!-- Robot head -->
  <rect x="10" y="10" width="20" height="20" rx="4" fill="url(#faceGradientDark)" opacity="0.95"/>

  <!-- Eyes -->
  <circle cx="16" cy="18" r="2.5" fill="#66BB6A"/>
  <circle cx="24" cy="18" r="2.5" fill="#66BB6A"/>

  <!-- Eye highlights -->
  <circle cx="16.8" cy="17.2" r="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="24.8" cy="17.2" r="1" fill="#ffffff" opacity="0.9"/>

  <!-- Mouth/smile -->
  <rect x="14" y="25" width="12" height="2.5" rx="1.25" fill="#66BB6A"/>

  <!-- Antenna -->
  <line x1="20" y1="10" x2="20" y2="6" stroke="#F1F8E9" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="5" r="1.5" fill="#F1F8E9"/>

  <!-- Robot frame accents -->
  <rect x="8" y="16" width="2" height="8" rx="1" fill="#F1F8E9" opacity="0.8"/>
  <rect x="30" y="16" width="2" height="8" rx="1" fill="#F1F8E9" opacity="0.8"/>
</svg>
