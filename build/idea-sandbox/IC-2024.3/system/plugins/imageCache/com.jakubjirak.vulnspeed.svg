<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient - Red/Orange for speed and security -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="40" height="40" rx="8" fill="url(#bgGradient)"/>

  <!-- Shield outline (Security) -->
  <path d="M20 7 L27 10 L27 17 Q27 22 20 28 Q13 22 13 17 L13 10 Z"
        fill="none"
        stroke="url(#shieldGradient)"
        stroke-width="1.8"
        stroke-linejoin="round"/>

  <!-- Inner shield fill -->
  <path d="M20 9 L25 11.5 L25 16.5 Q25 20.5 20 25 Q15 20.5 15 16.5 L15 11.5 Z"
        fill="url(#shieldGradient)"
        opacity="0.9"/>

  <!-- Lightning bolt symbol (GPU Speed) -->
  <path d="M21 12 L18 18 L20 18 L19 24 L23 17 L21 17 Z"
        fill="url(#lightningGradient)"
        stroke="#ef4444"
        stroke-width="0.5"/>

  <!-- Speed lines decoration -->
  <path d="M9 13 L11 13"
        stroke="#fef3c7"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.7"/>
  <path d="M8 16 L10 16"
        stroke="#fef3c7"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.5"/>
  <path d="M29 13 L31 13"
        stroke="#fef3c7"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.7"/>
  <path d="M30 16 L32 16"
        stroke="#fef3c7"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.5"/>
</svg>
